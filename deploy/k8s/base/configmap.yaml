apiVersion: v1
kind: ConfigMap
metadata:
  name: ams-config
  namespace: ams
data:
  ENV: production
  HOST: 0.0.0.0
  PORT: "8080"
  PUBLIC_URL: https://ams.example.com
  TZ: Asia/Ho_Chi_Minh
  CORS_ALLOW_ORIGINS: https://ams.example.com,https://admin.example.com
  JWT_ISSUER: ams-auth-server
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 168h
  ENABLE_METRICS: "true"
  ENABLE_PPROF: "false"
  ENABLE_SECURITY_HEADERS: "true"
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME: 30m
  DB_CONN_MAX_IDLE_TIME: 15m
  REDIS_ADDR: redis-master.redis.svc.cluster.local:6379
  REDIS_DB: "0"
  HTTP_READ_HEADER_TIMEOUT: 5s
  HTTP_READ_TIMEOUT: 15s
  HTTP_WRITE_TIMEOUT: 30s
  HTTP_IDLE_TIMEOUT: 60s
  SHUTDOWN_TIMEOUT: 20s
